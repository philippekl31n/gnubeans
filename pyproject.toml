[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnubeans"
version = "2026.05.dev1"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
validate = ["beancount"]

[project.scripts]
gnubeans = "gnubeans.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = ["pytest>=8"]
