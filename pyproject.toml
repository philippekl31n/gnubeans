[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gnubeans"
version = "2026.05.dev3"
requires-python = ">=3.10"
dependencies = [
    "rich>=13",
    "questionary>=2",
]

[project.optional-dependencies]
validate = ["beancount"]

[project.scripts]
gnubeans = "gnubeans.cli:main"
gnubeans-prototype = "gnubeans.tui_prototype:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[dependency-groups]
dev = ["pytest>=8"]
